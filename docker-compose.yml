services:
  # Local Database Service
  db:
    image: postgres:15-alpine
    container_name: dlp-db
    restart: always
    environment:
      POSTGRES_USER: dlp_user
      POSTGRES_PASSWORD: dlp_password123
      POSTGRES_DB: dlp_learning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlp_user -d dlp_learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache (Session caching, rate limiting, WebSocket pub/sub)
  redis:
    image: redis:7-alpine
    container_name: dlp-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dlp-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://dlp_user:dlp_password123@db:5432/dlp_learning_db
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Next.js Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dlp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # AI Service Microservice (Skeleton - uncomment when ai-service is created)
  # ai-service:
  #   build:
  #     context: ./ai-service
  #     dockerfile: Dockerfile.dev
  #   container_name: dlp-ai-service
  #   restart: unless-stopped
  #   ports:
  #     - "5001:5001"
  #   environment:
  #     - PORT=5001
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}

volumes:
  postgres_data:
    driver: local
