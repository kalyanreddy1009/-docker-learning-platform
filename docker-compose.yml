version: '3.8'

services:
  # Local Database Service
  db:
    image: postgres:15-alpine
    container_name: dlp-db
    restart: always
    environment:
      POSTGRES_USER: dlp_user
      POSTGRES_PASSWORD: dlp_password123
      POSTGRES_DB: dlp_learning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

